<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adam Mustafa — To The Hiring Managers</title>
<style>
  :root{
    --lima-navy:#0b1c3d;
    --lima-orange:#ff6a00;
    --lima-orange-light:#ffb347;
    --lima-white:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--lima-navy);
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,106,0,0.30), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,179,71,0.25), transparent 50%),
      linear-gradient(135deg, #060f24 0%, #0b1c3d 55%, #0d234f 100%);
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:48px 48px;
    animation:pan 18s linear infinite;
    opacity:0.5;
  }
  @keyframes pan{
    from{background-position:0 0,0 0;}
    to{background-position:480px 480px,480px 480px;}
  }
  .node{
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--lima-orange);
    box-shadow:0 0 12px 3px rgba(255,106,0,0.8);
    animation:float 6s ease-in-out infinite;
  }
  .node:nth-child(1){top:18%;left:12%;animation-delay:0s;}
  .node:nth-child(2){top:75%;left:20%;animation-delay:1.2s;background:var(--lima-orange-light);box-shadow:0 0 12px 3px rgba(255,179,71,0.8);}
  .node:nth-child(3){top:30%;left:88%;animation-delay:2.1s;}
  .node:nth-child(4){top:82%;left:80%;animation-delay:0.6s;background:var(--lima-orange-light);box-shadow:0 0 12px 3px rgba(255,179,71,0.8);}
  .node:nth-child(5){top:55%;left:6%;animation-delay:3s;}
  @keyframes float{
    0%,100%{transform:translateY(0) scale(1);opacity:0.8;}
    50%{transform:translateY(-18px) scale(1.3);opacity:1;}
  }
  .content{
    position:relative;z-index:2;
    text-align:center;
    color:var(--lima-white);
    padding:0 40px;
  }
  .eyebrow{
    font-size:16px;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--lima-orange-light);
    font-weight:600;
    margin-bottom:18px;
    opacity:0.95;
  }
  h1{
    font-size:52px;
    font-weight:800;
    line-height:1.15;
    margin-bottom:14px;
    background:linear-gradient(90deg,#ffffff, #ffd9ad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  h1 span{
    display:block;
    font-size:27px;
    font-weight:500;
    color:var(--lima-orange-light);
    -webkit-text-fill-color:var(--lima-orange-light);
    margin-top:10px;
  }
  .sub{
    font-size:19px;
    color:rgba(255,255,255,0.75);
    max-width:660px;
    margin:22px auto 0;
    line-height:1.5;
  }
  .loader-wrap{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .bar-track{
    width:340px;
    height:6px;
    border-radius:6px;
    background:rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    border-radius:6px;
    background:linear-gradient(90deg, var(--lima-orange), var(--lima-orange-light));
    animation:load 3.4s ease-in-out infinite;
  }
  @keyframes load{
    0%{width:0%;}
    60%{width:92%;}
    80%{width:78%;}
    100%{width:100%;}
  }
  .status{
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
  }
  .tag{
    position:absolute;
    bottom:34px;left:0;right:0;
    text-align:center;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.4);
  }
  .tag b{color:var(--lima-orange-light);font-weight:700;letter-spacing:3px;}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="node"></div>
  <div class="node"></div>
  <div class="node"></div>
  <div class="node"></div>
  <div class="node"></div>

  <div class="content">
    <div class="eyebrow">To The Hiring Managers</div>
    <h1>Adam Mustafa
      <span>2nd Line Modern Workplace Engineer</span>
    </h1>
    <p class="sub">Service-desk experience meets Azure, Microsoft 365, and endpoint management expertise — ready to own incidents, support customers, and grow with the LIMA team in Salford Quays.</p>

    <div class="loader-wrap">
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="status">Loading introduction&hellip;</div>
    </div>
  </div>

  <div class="tag">Prepared for <b>#TeamLIMA</b></div>
</div>
</body>
</html>
